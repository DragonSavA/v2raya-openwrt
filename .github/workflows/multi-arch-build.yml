name: Build legacy v2rayA for GL-MT3600BE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/multi-arch-build.yml"
      - "scripts/build-standalone-ipk.sh"
      - "scripts/verify-ipk.sh"
      - "v2raya/**"

permissions:
  contents: read

jobs:
  build:
    name: Build aarch64_cortex-a53 package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go 1.21
        uses: actions/setup-go@v6
        with:
          go-version: "1.21.x"
          cache-dependency-path: v2raya/Makefile

      - name: Build and verify package
        run: bash scripts/build-standalone-ipk.sh

      - name: Store package
        uses: actions/upload-artifact@v5
        with:
          name: v2raya-2.2.7.5-r2-aarch64_cortex-a53
          path: |
            artifacts/*.ipk
            artifacts/*.sha256
          if-no-files-found: error
