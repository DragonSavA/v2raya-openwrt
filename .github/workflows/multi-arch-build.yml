name: Build and release legacy v2rayA

on:
  workflow_dispatch:
  push:
    branches:
      - legacy-2.2.7.5-memfix
  pull_request:
    branches:
      - legacy-2.2.7.5-memfix

permissions:
  contents: read

concurrency:
  group: legacy-v2raya-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      architectures: ${{ steps.matrix.outputs.architectures }}
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax and installer scenarios
        run: |
          bash -n scripts/build-standalone-ipk.sh scripts/build-xray-ipk.sh scripts/verify-ipk.sh scripts/prepare-release.sh scripts/package-config.sh scripts/test-protocols.sh scripts/test-native-xray.sh
          sh -n scripts/install-release.sh
          python3 scripts/tests/test-install-release.py
          if command -v busybox >/dev/null 2>&1; then
            INSTALL_TEST_SHELL='busybox ash' INSTALL_TEST_BUSYBOX="$(command -v busybox)" python3 scripts/tests/test-install-release.py
          fi
      - name: Read supported architectures
        id: matrix
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = [line.split('\t') for line in Path('scripts/architectures.tsv').read_text().splitlines()
                  if line and not line.startswith('#')]
          assert rows and all(len(row) == 6 for row in rows)
          arches = [row[0] for row in rows]
          assert len(arches) == len(set(arches))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('architectures=' + json.dumps(arches) + '\n')
          PY

  build:
    needs: prepare
    name: Build ${{ matrix.architecture }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.prepare.outputs.architectures) }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up the pinned legacy Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.21.13"
          cache-dependency-path: scripts/package-config.sh
      - name: Build and verify package
        run: bash scripts/build-standalone-ipk.sh "$PACKAGE_ARCH"
        env:
          PACKAGE_ARCH: ${{ matrix.architecture }}
      - name: Set up the pinned Xray Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache-dependency-path: scripts/package-config.sh
      - name: Build and verify Xray
        run: bash scripts/build-xray-ipk.sh "$PACKAGE_ARCH"
        env:
          PACKAGE_ARCH: ${{ matrix.architecture }}
      - name: Store package
        uses: actions/upload-artifact@v5
        with:
          name: v2raya-${{ matrix.architecture }}
          path: |
            artifacts/*.ipk
            artifacts/*.ipk.sha256
          if-no-files-found: error

  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: v2raya-x86_64
          path: artifacts
      - uses: actions/setup-go@v6
        with:
          go-version: "1.21.13"
          cache-dependency-path: scripts/package-config.sh
      - name: Test native Xray, subscriptions and loopback TCP/UDP
        run: bash scripts/test-native-xray.sh artifacts

  release:
    needs: [prepare, build, compatibility]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/legacy-2.2.7.5-memfix'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Collect all packages
        uses: actions/download-artifact@v5
        with:
          pattern: v2raya-*
          merge-multiple: true
          path: artifacts
      - name: Verify the complete release and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source scripts/package-config.sh
          tag="v$full_version-${GITHUB_SHA:0:12}"
          bash scripts/prepare-release.sh artifacts "$tag" "$GITHUB_SHA"
          {
            printf 'Legacy v2rayA %s with the GeoIP memory fix and native Hysteria2; Xray %s.\n\n' "$full_version" "$xray_version"
            printf 'Source commit: [%s](https://github.com/%s/commit/%s).\n\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'Install on the router using the instructions in [README](https://github.com/%s/blob/%s/README.md) or INSTALL-RU.md.\n\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'Requires opkg and iptables/firewall3. The installer upgrades v2raya and older Xray after configuration preflight; LuCI/dependencies remain from the original feed.\n\n'
            printf 'WARNING: Xray 26.3.27 rejects allowInsecure=true after 2026-06-01. Correct TLS certificates/SNI before upgrading; see INSTALL-RU.md.\n\n'
            printf 'The previous r2 was reported working on GL-MT3600BE. This r3 and Xray update has host tests; real-router testing remains necessary.\n\n'
            printf 'Packages:\n'
            awk -F '\t' '$1 == "package" { printf "- `%s` (%s)\n", $2, $7 }' artifacts/release-manifest.tsv
          } > artifacts/release-notes.md
          # An already published tag is left intact when this commit is rerun.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > artifacts/is-draft.txt; then
            if grep -qx false artifacts/is-draft.txt; then
              echo "Release $tag is already published; nothing to replace."
              exit 0
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v2rayA $full_version legacy (${GITHUB_SHA:0:12})" \
              --notes-file artifacts/release-notes.md --draft
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/*.ipk artifacts/*.ipk.sha256 artifacts/SHA256SUMS \
            artifacts/release-manifest.tsv artifacts/install-release.sh \
            artifacts/architectures.tsv artifacts/INSTALL-RU.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --notes-file artifacts/release-notes.md
